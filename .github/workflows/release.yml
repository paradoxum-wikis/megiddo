name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Add Go bin to PATH
        shell: pwsh
        run: echo "$(go env GOPATH)/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: wails build -webview2 embed -trimpath -ldflags "-s -w" -o megiddo

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: build/bin/megiddo.exe
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: artifacts

      - name: Package release
        run: |
          mkdir -p release
          cp artifacts/megiddo.exe release/
          cp README.md release/
          cd release
          zip -r ../megiddo-windows-amd64.zip .

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          generate_release_notes: true
          files: megiddo-windows-amd64.zip
