name: Build and Release
on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            - name: Run tests
              shell: pwsh
              run: go test ./... -v

            - name: Install Wails CLI
              shell: pwsh
              run: |
                  go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
                  echo "$(go env GOPATH)/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

            - name: Build
              shell: pwsh
              run: wails build -webview2 embed -trimpath -ldflags "-X main.version=build-${{ github.run_number }}" -upx -clean -o megiddo.exe

            - uses: actions/upload-artifact@v7
              with:
                  name: release-files
                  path: |
                      build/bin/megiddo.exe
                      README.md
                  if-no-files-found: error

    create-release:
        runs-on: ubuntu-slim
        needs: build-windows
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: release-zefiles
                  path: artifacts

            - name: Package release
              run: |
                  mkdir -p release
                  cp artifacts/megiddo.exe release/
                  cp artifacts/README.md release/
                  cd release
                  zip -r ../megiddo-windows-amd64.zip .

            - uses: softprops/action-gh-release@v3
              with:
                  tag_name: build-${{ github.run_number }}
                  name: build-${{ github.run_number }}
                  generate_release_notes: true
                  files: megiddo-windows-amd64.zip
